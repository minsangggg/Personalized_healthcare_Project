name: Deploy Frontend

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-2
      AWS_ACCOUNT_ID: "314432538223"
      ECR_REPOSITORY: "frontend-repo"
      IMAGE_TAG: "latest"

    steps:
      # 1) 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2) AWS 자격증명 설정 (GitHub Secrets 사용)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3) ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4) 프론트 이미지 빌드 & 푸시
      - name: Build and push frontend image
        working-directory: frontend
        run: |
           docker build -t ${ECR_REPOSITORY}:${IMAGE_TAG} -f frontend/Dockerfile ./frontend
          docker tag ${ECR_REPOSITORY}:${IMAGE_TAG} ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}

      # 5) 프론트 EC2에 SSH 접속해서 컨테이너 교체
      - name: Deploy to Frontend EC2
        env:
          EC2_HOST: ${{ secrets.EC2_FRONTEND_HOST }}   # 43.200.123.27 넣어둘 것
          EC2_USER: "ec2-user"
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}          # aws-keypair.pem 내용
        run: |
          echo "$EC2_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem

          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${EC2_USER}@${EC2_HOST} << 'EOF'
            set -e
            AWS_REGION="ap-northeast-2"
            AWS_ACCOUNT_ID="314432538223"
            ECR_REPOSITORY="frontend-repo"
            IMAGE_TAG="latest"

            echo "▶ ECR 로그인"
            aws ecr get-login-password --region ${AWS_REGION} \
              | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

            echo "▶ 최신 frontend 이미지 pull"
            docker pull ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}

            echo "▶ 기존 frontend 컨테이너 중지/삭제"
            docker rm -f frontend || true

            echo "▶ 새 frontend 컨테이너 실행"
            docker run -d \
              --name frontend \
              --restart unless-stopped \
              -p 80:80 \
              ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}

            echo "✅ Frontend 배포 완료"
          EOF
